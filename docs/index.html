<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>RO 道具取得管道查詢</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>RO 道具取得管道查詢</h1>
<nav>
  <a href="index.html">道具查詢</a>
  <a href="sources.html">資料來源清單（QA）</a>
</nav>

<form id="search-form">
  <input id="search-keyword" type="text" placeholder="輸入搜尋關鍵字（預設比對道具名稱是否包含此字串）" autocomplete="off" required>
  <label id="regex-label"><input id="use-regex" type="checkbox"> 使用正規表示式</label>
  <button type="submit">查詢</button>
</form>
<div id="status"></div>
<table id="result-table" hidden>
  <thead>
    <tr>
      <th>道具名稱</th>
      <th>管道類型</th>
      <th>活動名稱</th>
      <th>機率／取得條件</th>
      <th>公告發布日期</th>
      <th>來源公告</th>
    </tr>
  </thead>
  <tbody id="result-body"></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
