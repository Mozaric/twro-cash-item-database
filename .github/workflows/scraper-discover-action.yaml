# file: .github/workflows/scraper-discover-action.yaml
# example: https://github.com/actions/starter-workflows/blob/main/ci/python-app.yml
# reference: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Run scraper discover

on:
  schedule:
    # Every Tuesday at 19:00 Asia/Taipei (11:00 UTC)
    - cron: "0 11 * * 2"
  workflow_dispatch:
    inputs:
      notice_id:
        description: "Notice ID"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scraper-discover-main
  cancel-in-progress: false

env:
  TARGET_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicitly use Bash; GitHub Actions runs it with -e and -o pipefail
        shell: bash
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check workspace
        run: |
          pwd
          echo "$GITHUB_WORKSPACE"
          ls -la
      - name: Set timestamp
        run: |
          echo "TIMESTAMP=$(TZ=Asia/Taipei date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run scraper discover
        env:
          NOTICE_ID: ${{ inputs.notice_id }}
        run: |
          if [[ -n "${NOTICE_ID}" ]]; then
            python -m scraper.cli "${NOTICE_ID}"
          else
            python -m scraper.cli --discover
          fi
      - name: Commit
        run: |
          git status --short -- docs/
          git add -A -- docs/

          if git diff --cached --quiet -- docs/; then
            echo "No changes in docs/. Skipping commit and push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "docs: update data ${TIMESTAMP}" -- docs/
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
